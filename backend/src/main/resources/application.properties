spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/rh_db
spring.datasource.username=mrtovo
spring.datasource.password=mrtovo

# Le schéma est géré par schema.sql / data.sql (et non plus par Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=mrtovo
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Exécute schema.sql puis data.sql à chaque démarrage (environnement de dev :
# la base est remise à zéro avec les données de démonstration)
spring.sql.init.mode=always
