spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/rh_db?currentSchema=mrtovo
spring.datasource.username=mrtovo
spring.datasource.password=mrtovo

# Le Bloc 1 conserve son schéma relationnel historique `public`; les Blocs 2 et 3 utilisent `mrtovo`.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=mrtovo
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Les scripts sont idempotents et conservent les données existantes.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.platform=postgresql

bloc3.duree-validite-jours=7
bloc3.periode-essai-defaut-mois=6
bloc3.duree-max-cdd-mois=24
bloc3.donnees-demo=false

server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
bloc2.cv-storage-dir=${BLOC2_CV_STORAGE_DIR:uploads/cv}

# Bloc 5 : pieces administratives des salaries (hors depot Git).
bloc5.documents-dir=${BLOC5_DOCUMENTS_DIR:uploads/documents}
