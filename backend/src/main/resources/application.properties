spring.application.name=backend

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/rh_db
spring.datasource.username=mrtovo
spring.datasource.password=mrtovo

# Bloc 1 (schéma public) : tables créées/mises à jour par Hibernate + DataInitializer
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Bloc 2 (schéma mrtovo) : schema.sql puis data.sql exécutés à chaque démarrage, avant Hibernate.
# Ils ne créent que ce qui manque : les données existantes sont conservées.
spring.sql.init.mode=always

server.port=8012
